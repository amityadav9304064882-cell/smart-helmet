    /* Custom Scrollbars */
    ::-webkit-scrollbar { width: 6px; height: 6px; }

    ::-webkit-scrollbar-thumb { background: #21262d; border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: #f59e0b; }

    /* Page Slide In Transition */
    @keyframes pageSlideIn {
      from { opacity: 0; transform: translateX(20px); }
      to { opacity: 1; transform: translateX(0); }
    }
    .animate-page-slide {
      animation: pageSlideIn 0.32s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    /* Danger Flashing */
    @keyframes flashDangerRed {
      0%, 100% { box-shadow: 0 0 0px 0px rgba(239, 68, 68, 0.4); border-color: rgba(239, 68, 68, 0.6); }
      50% { box-shadow: 0 0 24px 6px rgba(239, 68, 68, 0.85); border-color: rgba(239, 68, 68, 1); }

    .animate-flash-danger {
      animation: flashDangerRed 1.2s infinite ease-in-out;
    }

    /* Profile Page Specific Animations */
    @keyframes profileFadeUp {
      from { opacity: 0; transform: translateY(16px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .profile-section-anim {
      animation: profileFadeUp 0.45s cubic-bezier(0.16, 1, 0.3, 1) both;
    }

    @keyframes helmetStatusPulse {
      0%, 100% { transform: scale(1); filter: drop-shadow(0 0 0px var(--pulse-color, #10b981)); }
      50% { transform: scale(1.03); filter: drop-shadow(0 0 14px var(--pulse-color, #10b981)); }
    }
    .profile-helmet-pulse {
      animation: helmetStatusPulse 2.8s ease-in-out infinite;
    }

    /* Respect prefers-reduced-motion */
    @media (prefers-reduced-motion: reduce) {
      .animate-page-slide,
      .animate-flash-danger,
      .profile-section-anim,
      .profile-helmet-pulse {
        animation: none !important;
        transition: none !important;
        transform: none !important;
        opacity: 1 !important;
      }
    }

    @media print {
      body { background: #fff !important; color: #000 !important; }
      header, aside, .no-print { display: none !important; }
    }

    // --- 3. SAFETY SCORING HELPER ---
    function calcSafetyScore(w) {
      const t = w.telemetry || {};
      if (t.sosPressed) {
        return { score: 8, tier: 'CRITICAL', color: '#ef4444', text: 'NOT SAFE (SOS PRESSED)' };
      }
      let score = 100;
      if (!t.online) score -= 45;
      if (t.fallDetected) score -= 55;
      if (t.motionState === 'IMMOBILE') score -= 60;
      if (t.waterDetected) score -= 50;
      if (t.mq2_methane_ppm > 350) score -= 65;
      else if (t.mq2_methane_ppm > 150) score -= 35;
      else if (t.mq2_methane_ppm > 70) score -= 15;
      if (t.mq7_co_ppm > 30) score -= 25;
      if (t.oxygen_pct < 19.5) score -= 20;

      score = Math.max(5, Math.min(100, score));

      if (score >= 80) return { score, tier: 'SAFE', color: '#10b981', text: 'SAFE' };
      if (score >= 60) return { score, tier: 'CAUTION', color: '#eab308', text: 'CAUTION' };
      if (score >= 40) return { score, tier: 'HIGH RISK', color: '#f97316', text: 'HIGH RISK' };
      return { score, tier: 'CRITICAL', color: '#ef4444', text: 'NOT SAFE / CRITICAL' };
    }

    function getHelmetColor(w) {
      const t = w.telemetry || {};
      if (!t.online) return { fill: '#6b7280', label: 'Offline' };
      if (t.rescueStatus && t.rescueStatus !== 'NONE') return { fill: '#3b82f6', label: 'Rescue Team Assigned' };
      const s = calcSafetyScore(w);
      return { fill: s.color, label: s.text };
    }
